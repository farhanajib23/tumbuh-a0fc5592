<script>
'use strict';
const ICONS={sprout:'M12 21v-9M12 15C4 15 3 10 3 5c6 0 9 3 9 7M12 11c0-5 3-8 9-8 0 6-3 9-9 9',dashboard:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',check:'M9 12l2 2 5-5M21 12a9 9 0 1 1-4-7',book:'M12 5v16M3 3l9 2 9-2v16l-9 2-9-2z',flag:'M5 22V3M5 4c5-4 9 4 15 0v10c-6 4-10-4-15 0',wallet:'M3 6h18v15H3zM3 6V3h16v3M16 11h5v5h-5z',learn:'M2 9l10-5 10 5-10 5zM6 11v7c4 3 8 3 12 0v-7M22 9v8',battery:'M2 6h17v12H2zM22 10v4M6 10v4M10 10v4',chart:'M3 3v18h18M7 15l4-5 4 3 5-7',lock:'M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5zM12 14v3',target:'M12 8v8M8 12h8M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',sun:'M12 3V1M12 23v-2M3 12H1M23 12h-2M5 5 3 3M21 21l-2-2M5 19l-2 2M21 3l-2 2M17 12a5 5 0 1 1-10 0 5 5 0 0 1 10 0',water:'M12 2C9 7 5 11 5 15a7 7 0 0 0 14 0c0-4-4-8-7-13',clock:'M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',heart:'M20 5c-3-3-6-1-8 1-2-2-5-4-8-1s-1 7 8 14c9-7 11-11 8-14'};
const MODULES=[
['dashboard','Life Dashboard','Lihat gambaran perjalanan pertumbuhanmu.','dashboard','sage',true],
['habit','Habit & Routine Tracker','Bangun kebiasaan kecil yang berarti.','check','blue',true],
['journal','Journal & Self-Reflection','Ruang untuk mendengar dan memahami diri.','book','rose',false],
['goals','Goals & Action Planner','Ubah tujuan menjadi langkah yang nyata.','flag','violet',false],
['finance','Personal Finance','Kelola keuangan dengan lebih sadar.','wallet','ochre',false],
['learning','Learning & Skill Development','Terus belajar, buka kemungkinan baru.','learn','blue',false],
['energy','Time & Energy Management','Temukan ritme yang baik untuk dirimu.','battery','sage',false],
['insights','Growth Insights','Kenali pola dan rayakan perjalananmu.','chart','violet',false]
];
const PRESETS=[
{id:'wake',name:'Bangun pagi pukul 04.30',kind:'time',time:'04:30',icon:'sun',desc:'Catat waktu bangun aktual. Membuka aplikasi tidak menandai selesai.'},
{id:'water',name:'Minum air putih',kind:'quantity',target:4000,unit:'ml',icon:'water',desc:'Target pribadi awal, bukan rekomendasi universal. Jangan memaksakan target atau minum banyak sekaligus; kebutuhan setiap orang berbeda.'},
{id:'workout',name:'Workout harian',kind:'components',icon:'battery',desc:'Catat setiap komponen secara terpisah. Jangan berlatih melalui rasa sakit. Repetisi dan menit tidak dijumlahkan menjadi satu skor.',components:[['pushup-subuh','Push-up setelah Subuh',20,'repetisi'],['pushup-zuhur','Push-up setelah Zuhur',20,'repetisi'],['pushup-asar','Push-up setelah Asar',20,'repetisi'],['pushup-magrib','Push-up setelah Magrib',20,'repetisi'],['pushup-isya','Push-up setelah Isya',20,'repetisi'],['pullup','Pull-up',7,'repetisi'],['plank','Plank',1,'menit'],['weightlifting','Weightlifting',5,'menit']]},
{id:'meditation',name:'Meditasi',kind:'quantity',target:7,unit:'menit',icon:'sprout',desc:'Duduk nyaman, amati napas alami, sadari pikiran tanpa menghakimi, lalu kembali ke napas. Tidak harus selalu merasa tenang.'},
{id:'prayer',name:'Salat lima waktu tepat waktu',kind:'components',icon:'clock',desc:'Pelaksanaan dan ketepatan waktu dicatat manual. Tidak ada jadwal lokal atau verifikasi otomatis.',components:[['subuh','Subuh',1,'pelaksanaan'],['zuhur','Zuhur',1,'pelaksanaan'],['asar','Asar',1,'pelaksanaan'],['magrib','Magrib',1,'pelaksanaan'],['isya','Isya',1,'pelaksanaan']]},
{id:'learning',name:'Menonton podcast atau video pembelajaran',kind:'checklist',icon:'learn',desc:'Satu sesi konten yang sengaja dipilih untuk belajar, bukan durasi wajib.'},
{id:'journaling',name:'Journaling',kind:'checklist',icon:'book',desc:'Tandai sesi jurnal, bukan isi jurnal. Modul Journal masih belum tersedia.'},
{id:'walking',name:'Berjalan 5.000 langkah',kind:'quantity',target:5000,unit:'langkah',icon:'check',desc:'Catat langkah aktual secara manual. Tidak ada koneksi perangkat atau pelacakan otomatis.'},
{id:'reading',name:'Membaca buku atau novel',kind:'quantity',target:30,unit:'menit',icon:'book',desc:'Catat durasi membaca. Target ini bukan target hasil halaman mingguan.'},
{id:'detox',name:'Social detox',kind:'quantity',target:90,unit:'menit',icon:'heart',desc:'Catat durasi tanpa media sosial. Tidak ada pemantauan perangkat. Kebutuhan komunikasi penting tidak harus dianggap gagal.'},
{id:'bed',name:'Merapikan tempat tidur',kind:'checklist',icon:'check',desc:'Tandai secara manual setelah merapikan tempat tidur.'}
];
const STORAGE_KEY='tumbuh-standalone-html-v1';
const THEME_KEY=STORAGE_KEY+'-theme';
const $=s=>document.querySelector(s);
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(name,cls='')=>`<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[name]||ICONS.sprout}"/></svg>`;
const dateKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>dateKey();
const parseDate=d=>new Date(d+'T12:00:00');
const validDate=d=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(parseDate(d))&&dateKey(parseDate(d))===d;
const shift=(d,n)=>{const x=parseDate(d);x.setDate(x.getDate()+n);return dateKey(x)};
const fmt=d=>new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'short',year:'numeric'}).format(parseDate(d));
const num=n=>Number(n).toLocaleString('id-ID',{maximumFractionDigits:1});
let state={version:1,started:null,entries:{}};
let storageOK=true, storageProblem='';
try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const v=JSON.parse(raw);if(v.version!==1||(v.started!==null&&!validDate(v.started))||!v.entries||typeof v.entries!=='object'||Array.isArray(v.entries))throw Error('Format data tidak dikenali');for(const [d,records] of Object.entries(v.entries)){if(!validDate(d)||!records||typeof records!=='object'||Array.isArray(records))throw Error('Catatan tidak valid');for(const [id,e] of Object.entries(records)){if(!PRESETS.some(p=>p.id===id)||!e||typeof e.done!=='boolean'||!['done','partial','notDone'].includes(e.status)||(e.value!=null&&(!Number.isFinite(e.value)||e.value<0))||(e.components&&Object.values(e.components).some(n=>!Number.isFinite(n)||n<0)))throw Error('Isi catatan tidak valid')}}state=v}}catch(e){storageOK=false;storageProblem='Data lokal tidak dapat dibaca dengan aman. File ini tidak menimpa data tersebut. '+e.message}
let selectedDate=today(),period=7,endDate=today(),filter='all',dashPeriod=7;
let noticeTimer;
function notify(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('#toast').hidden=true,4200)}
function save(next){if(!storageOK){notify('Penyimpanan diblokir. Amankan data terlebih dahulu.');return false}try{const existing=localStorage.getItem(STORAGE_KEY);if(existing!==null&&existing!==JSON.stringify(state)){storageOK=false;storageProblem='Data berubah di tab lain. Muat ulang halaman sebelum menyimpan.';notify(storageProblem);return false}localStorage.setItem(STORAGE_KEY,JSON.stringify(next));state=next;return true}catch(e){notify('Tidak tersimpan: penyimpanan browser tidak tersedia.');return false}}
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY||e.key===null){storageOK=false;storageProblem='Data berubah di tab lain. Muat ulang halaman sebelum menyimpan.';render()}});
try{document.documentElement.dataset.theme=localStorage.getItem(THEME_KEY)||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}
$('#theme-btn').onclick=()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem(THEME_KEY,theme)}catch(e){}};
function info(title,text){$('#dialog-title').textContent=title;$('#dialog-text').textContent=text;$('#info-dialog').showModal()}
$('#about-btn').onclick=()=>info('Selamat datang di TUMBUH','Versi HTML mandiri yang disusun ulang dari tampilan source GitHub. Semua CSS dan JavaScript berada di file ini. Catatan memakai penyimpanan lokal baru yang terpisah; tidak membaca atau menyinkronkan data aplikasi React. Foto banner diganti ilustrasi SVG. Modul terkunci belum tersedia.');
$('#menu-btn').onclick=()=>{location.hash='lainnya'};
const activePresets=d=>state.started&&d>=state.started?PRESETS:[];
function summary(d,which='all'){const presets=activePresets(d).filter(p=>which==='all'||p.id===which);const counts={done:0,partial:0,notDone:0,unrecorded:0};for(const p of presets){const e=state.entries[d]?.[p.id];counts[e?e.status:'unrecorded']++}const scheduled=presets.length;return {...counts,scheduled,percent:scheduled?Math.round(counts.done/scheduled*100):null}}
function report(end,len,which='all'){const days=Array.from({length:len},(_,i)=>{const date=shift(end,i-len+1);return {date,...summary(date,which)}});const counts=days.reduce((a,x)=>{for(const k of ['done','partial','notDone','unrecorded','scheduled'])a[k]+=x[k];return a},{done:0,partial:0,notDone:0,unrecorded:0,scheduled:0});return {...counts,days,percent:counts.scheduled?Math.round(counts.done/counts.scheduled*100):null}}
function ring(s){return `<div class="ring-wrap"><div class="ring" style="--percent:${s.percent??0}" role="progressbar" aria-label="Penyelesaian kebiasaan terjadwal" aria-valuemin="0" aria-valuemax="100" ${s.percent===null?'aria-valuetext="Tidak ada jadwal"':`aria-valuenow="${s.percent}"`}><span>${s.percent===null?'—':s.percent+'%'}</span></div><p class="muted">${s.done} dari ${s.scheduled} kesempatan terjadwal selesai${s.percent===null?' · Tidak ada jadwal':''}</p></div>`}
function counts(s){return `<dl class="counts">${[['done','Selesai'],['partial','Parsial'],['notDone','Tidak selesai / di luar target'],['unrecorded','Belum dicatat']].map(([k,label])=>`<div class="count"><dt>${label}</dt><dd>${s[k]}</dd></div>`).join('')}</dl>`}
function chart(r){return `<div class="chart" aria-hidden="true">${r.days.map(d=>`<div class="chart-col" title="${d.date}: ${d.percent===null?'Tidak ada jadwal':d.percent+'%'}"><i style="height:${d.percent??0}%"></i></div>`).join('')}</div><div class="chart-dates"><span>${fmt(r.days[0].date)}</span><span>${fmt(r.days.at(-1).date)}</span></div><details><summary>Tabel rincian tren</summary><div class="table-wrap" tabindex="0" role="region" aria-label="Rincian tren"><table><caption>Tren penyelesaian ${r.days.length} hari</caption><thead><tr><th scope="col">Tanggal</th><th scope="col">Selesai</th><th scope="col">Terjadwal</th><th scope="col">Penyelesaian</th></tr></thead><tbody>${r.days.map(d=>`<tr><th scope="row">${fmt(d.date)}</th><td>${d.done}</td><td>${d.scheduled}</td><td>${d.percent===null?'Tidak ada jadwal':d.percent+'%'}</td></tr>`).join('')}</tbody></table></div></details>`}
const heading=(title,desc,extra='')=>`<div class="heading"><div><h1>${title}</h1><p>${desc}</p></div>${extra}</div>`;
const tabs=page=>`<nav class="tabs" aria-label="Halaman kebiasaan">${[['harian','Harian'],['statistik','Statistik'],['riwayat','Riwayat'],['cadangan','Cadangan']].map(([id,label])=>`<a href="#${id}" class="btn ${page===id?'active':''}" ${page===id?'aria-current="page"':''}>${label}</a>`).join('')}</nav>`;
const localNote=()=>`<div class="local-note">HTML mandiri · Data baru terpisah dari aplikasi GitHub · Tidak ada sinkronisasi akun. ${storageOK?'Penyimpanan mengikuti izin browser; ekspor cadangan secara berkala.':escape(storageProblem)}</div>`;
const landscape=`<svg class="landscape" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#bcd6bd"/><stop offset="1" stop-color="#f0efd6"/></linearGradient><linearGradient id="hill" x2="0" y2="1"><stop stop-color="#9bb18a"/><stop offset="1" stop-color="#517652"/></linearGradient></defs><path fill="url(#sky)" d="M0 0h1200v300H0z"/><circle cx="950" cy="65" r="43" fill="#f8f1cd" opacity=".75"/><path d="M0 180Q180 80 360 150T710 90T1200 145V300H0Z" fill="#adc1a0"/><path d="M0 240Q220 125 470 210T890 155T1200 190V300H0Z" fill="url(#hill)"/><path d="M1200 235Q1000 125 825 242Q750 290 600 300H1200Z" fill="#41694d"/><path d="M795 300Q1010 235 900 205Q875 190 946 162" stroke="#d6d1a8" stroke-width="18" fill="none"/><g fill="#3c6249"><path d="M1050 126l-20 61h40zM1094 158l-17 52h34zM1005 179l-15 45h30zM1160 100l-24 73h48z"/></g></svg>`;
function moduleCards(){return `<div class="modules">${MODULES.map(([id,name,desc,ico,tone,available])=>`<a class="module-card" href="#${id==='habit'?'harian':id}"><div class="module-top"><div class="module-icon tone-${tone}">${icon(ico)}</div><span class="module-arrow">↗</span></div><h3>${name}</h3><p>${desc}</p><span class="tag ${available?'done':''}">${available?'✓ Tersedia':'Belum tersedia'}</span></a>`).join('')}</div>`}
function measuredTable(end,len=1,which='all'){const list=PRESETS.filter(p=>p.kind==='quantity'&&(which==='all'||p.id===which));return `<div class="table-wrap" tabindex="0" role="region" aria-label="Target dan realisasi"><table><caption>Target dan realisasi per kebiasaan</caption><thead><tr><th scope="col">Kebiasaan</th><th scope="col">Target</th><th scope="col">Aktual tercatat</th><th scope="col">Cakupan</th><th scope="col">Capaian</th></tr></thead><tbody>${list.map(p=>{let n=0,total=0,recorded=0;for(let i=0;i<len;i++){const d=shift(end,-i);if(!state.started||d<state.started)continue;n++;const e=state.entries[d]?.[p.id];if(e&&e.value!==null&&e.value!==undefined){total+=e.value;recorded++}}const target=n*p.target;return `<tr><th scope="row">${escape(p.name)}</th><td>${n?num(target)+' '+p.unit:'—'}</td><td>${recorded?num(total)+' '+p.unit:'—'}</td><td>${recorded}/${n} hari</td><td>${recorded&&target?num(total/target*100)+'%':'—'}</td></tr>`}).join('')||'<tr><td colspan="5">Tidak ada target angka pada pilihan ini.</td></tr>'}</tbody></table></div>`}
function greeting(){const h=new Date().getHours();return (h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam')+', selamat datang di TUMBUH.'}
function streak(){if(!state.started)return 0;const has=d=>state.entries[d]&&Object.values(state.entries[d]).some(e=>e.done);let n=0,d=today();if(!has(d))d=shift(d,-1);while(d>=state.started&&has(d)){n++;d=shift(d,-1)}return n}
function quickStats(){const s=summary(today()),r=report(today(),7),st=streak();const total=Object.values(state.entries).reduce((a,x)=>a+Object.keys(x).length,0);return `<div class="stats"><div class="stat"><small>Hari ini</small><b data-count="${s.percent??0}" data-suffix="%">${s.percent??0}%</b><span>${s.done} dari ${s.scheduled} selesai</span></div><div class="stat"><small>7 hari</small><b data-count="${r.percent??0}" data-suffix="%">${r.percent??0}%</b><span>${r.done} dari ${r.scheduled} kesempatan</span></div><div class="stat"><small>Runtutan</small><b data-count="${st}">${st}</b><span>hari dengan penyelesaian</span></div><div class="stat"><small>Catatan</small><b data-count="${total}">${total}</b><span>tersimpan di browser ini</span></div></div>`}
function dashboard(){const s=summary(today()),r=report(today(),dashPeriod);return heading('Life Dashboard','Ruang untuk melihat diri, satu langkah pada satu waktu.',`<div class="date-label">${icon('clock')}${new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date())}</div>`)+`<section class="welcome" aria-label="Sapaan TUMBUH">${landscape}<span class="orb a"></span><span class="orb b"></span><div class="welcome-copy"><div class="eyebrow">${icon('sun')} Hari baru, kesempatan baru</div><h2>${greeting()}</h2><p>Ambil jeda sejenak. Kenali dirimu hari ini, lalu mulai dari satu langkah kecil yang berarti.</p><div class="welcome-foot">${icon('sprout')} Perjalanan ini milikmu. Tidak perlu terburu-buru.</div></div></section>`+quickStats()+(state.started?`<section class="panel"><h2>Ringkasan kebiasaan hari ini</h2><p>${fmt(today())} · Belum dicatat bukan kegagalan.</p>${ring(s)}${counts(s)}<p class="muted">Ring menunjukkan penyelesaian terjadwal, bukan rata-rata capaian target angka.</p><div class="row" style="margin-top:24px"><h3>Tren pelaksanaan</h3><div class="actions">${[7,30].map(n=>`<button class="btn" data-dash-period="${n}" aria-pressed="${dashPeriod===n}">${n} hari</button>`).join('')}</div></div><p class="muted">${r.done} dari ${r.scheduled} kesempatan terjadwal selesai · ${r.percent??'—'}${r.percent===null?'':'%'}.</p>${chart(r)}<h3 style="margin-top:24px">Target terukur vs realisasi hari ini</h3>${measuredTable(today())}<div class="actions" style="margin-top:20px"><a class="btn primary" href="#harian">Lanjutkan pencatatan ↗</a><a class="btn" href="#statistik">Lihat statistik</a></div></section>`:`<section class="panel"><h2>Mulai dari satu kebiasaan yang berarti</h2><p>Belum ada catatan di versi HTML ini. Data aplikasi sebelumnya tidak otomatis dipindahkan.</p><a class="btn primary" href="#harian" style="margin-top:16px">Pilih kebiasaan ↗</a></section>`)+`<div class="two-grid"><section class="panel"><div class="row"><h3>${icon('target')} Fokus hari ini</h3><span class="tag">Belum ditentukan</span></div><div class="focus-content"><div class="empty-icon">${icon('target')}</div><div><h3>Apa yang berarti untukmu hari ini?</h3><p>Satu fokus kecil bisa menjadi awal perubahan yang baik.</p></div></div><button class="btn" id="focus-btn">＋ Tentukan fokus hari ini</button></section><section class="panel"><h3>${icon('sprout')} Langkah berikutnya</h3><p>Pilih kebiasaan yang relevan, catat pelaksanaan, lalu tinjau pengalamanmu. Angka bukan penilaian dirimu.</p><a class="btn" style="margin-top:18px" href="#harian">Buka kebiasaan harian ↗</a><p class="small">Fokus harian masih berupa panduan, bukan fitur penyimpanan baru.</p></section></div><section><div class="section-title row"><div><h2>Ruang untuk bertumbuh</h2><p>Berbagai sisi kehidupan, dalam satu perjalanan.</p></div><span class="muted">8 modul · 1 perjalanan</span></div>${moduleCards()}</section><footer class="footer"><span>♡ Bertumbuh bukan tentang menjadi sempurna, tetapi menjadi lebih sadar.</span><span>Pelan-pelan, tetap bertumbuh.</span></footer>`+localNote()}
const statusLabel=e=>!e?'Belum dicatat':({done:'Selesai',partial:'Parsial',notDone:'Tidak selesai / di luar target'})[e.status];
function habitCard(p){const e=state.entries[selectedDate]?.[p.id];const enabled=storageOK&&state.started&&selectedDate>=state.started;let fields='';if(p.kind==='quantity')fields=`<p class="muted">Target: ${num(p.target)} ${p.unit} · Aktual tersimpan: ${e?.value!=null?num(e.value):'—'}</p><div class="meter" aria-hidden="true"><i style="width:${Math.min(100,Math.round((e?.value||0)/p.target*100))}%"></i></div><label for="value-${p.id}">Total aktual (${p.unit})</label><input id="value-${p.id}" name="value" type="number" min="0" step="any" required value="${e?.value??''}" placeholder="Belum dicatat">`;if(p.kind==='time')fields=`<p class="muted">Target bangun: ${p.time}. Selesai jika waktu sama dengan target.</p><label for="time-${p.id}">Waktu bangun aktual</label><input id="time-${p.id}" name="time" type="time" required value="${escape(e?.time||'')}">`;if(p.kind==='checklist')fields=`<label class="check-label"><input name="done" type="checkbox" ${e?.done?'checked':''}> Sesi atau tindakan sudah dilakukan</label>`;if(p.kind==='components')fields=`<details><summary>Catat komponen satu per satu</summary>${p.components.map(([id,name,target,unit])=>`<div class="subcomponent"><label for="c-${p.id}-${id}">${escape(name)} — target ${target} ${unit}</label>${p.id==='prayer'?`<select id="c-${p.id}-${id}" name="component-${id}"><option value="">Belum dicatat</option><option value="0" ${e?.components?.[id]===0?'selected':''}>Tidak dilakukan</option><option value="1" ${e?.components?.[id]===1?'selected':''}>Sudah dilakukan</option></select><label class="check-label"><input type="checkbox" name="ontime-${id}" ${e?.onTime?.[id]?'checked':''}> Tepat waktu menurut catatan saya</label>`:`<input id="c-${p.id}-${id}" name="component-${id}" type="number" min="0" step="any" value="${e?.components?.[id]??''}" placeholder="Belum dicatat">`}</div>`).join('')}</details>`;return `<article class="panel habit-card"><div class="habit-title"><span class="habit-icon">${icon(p.icon)}</span><h3>${escape(p.name)}</h3></div><span class="tag ${e?.done?'done':''}">${statusLabel(e)}</span><p>${escape(p.desc)}</p><form data-habit="${p.id}" data-date="${selectedDate}"><fieldset ${enabled?'':'disabled'}>${fields}<div class="actions"><button class="btn primary" type="submit">Simpan catatan</button>${e?`<button class="btn" type="button" data-undo="${p.id}">Batalkan catatan</button>`:''}</div></fieldset></form>${enabled?'':`<p class="muted">${!state.started?'Aktifkan kebiasaan terlebih dahulu.':selectedDate<state.started?'Tanggal ini sebelum aktivasi.':'Penyimpanan diblokir; muat ulang halaman setelah mengamankan data.'}</p>`}</article>`}
function daily(){const s=summary(selectedDate);return heading('Habit & Routine Tracker','Bangun kebiasaan kecil yang berarti.')+tabs('harian')+`<section class="panel"><div class="row"><div><h2>11 kebiasaan harianmu</h2><p>${s.done} dari ${s.scheduled} kebiasaan terjadwal selesai. Belum dicatat bukan kegagalan.</p></div>${state.started?'<span class="tag done">✓ Kebiasaan aktif</span>':`<button class="btn primary" id="activate" ${storageOK?'':'disabled'}>＋ Aktifkan 11 kebiasaan</button>`}</div><p class="muted">Aktivasi mulai hari ini tanpa membuat catatan realisasi. Data hanya tersimpan di browser ini, tidak terenkripsi dan tidak tersinkronisasi. Tidak ada alarm atau pelacakan otomatis.</p><div class="row" style="margin-top:20px"><label class="date-input" for="daily-date">Tanggal pencatatan<input id="daily-date" type="date" value="${selectedDate}" max="${today()}" required></label><button class="btn" id="reload-btn">Muat ulang halaman</button></div></section>${!storageOK?`<div class="error" role="alert">${escape(storageProblem)}</div>`:''}<div class="habit-grid">${PRESETS.map(habitCard).join('')}</div>`+localNote()}
function statistics(){const r=report(endDate,period,filter);return heading('Statistik kebiasaan','Kenali perjalananmu, lalu pilih langkah berikutnya yang realistis.',`<button class="btn" id="refresh-stats">↻ Perbarui statistik</button>`)+tabs('statistik')+`<section class="panel"><h2>Lihat periode yang berarti untukmu</h2><div class="filters"><label>Kebiasaan<select id="stats-habit"><option value="all">Semua kebiasaan</option>${PRESETS.map(p=>`<option value="${p.id}" ${filter===p.id?'selected':''}>${escape(p.name)}</option>`).join('')}</select></label><label>Akhir periode statistik<input type="date" id="stats-end" value="${endDate}" max="${today()}" required></label></div><div class="row"><div class="actions">${[7,30].map(n=>`<button class="btn" data-period="${n}" aria-pressed="${period===n}">${n} hari</button>`).join('')}</div><button class="btn" id="clear-filter">Hapus filter</button></div></section><section class="panel"><h2>Progres periode ini</h2><p>${fmt(r.days[0].date)} sampai ${fmt(endDate)}</p>${ring(r)}${counts(r)}<p class="muted">Ring menunjukkan penyelesaian terjadwal, bukan rata-rata capaian target angka. Belum dicatat tidak dianggap gagal.</p></section><section class="panel"><h2>Tren pelaksanaan</h2><p>Persentase penyelesaian per hari selama ${period} hari, berakhir pada ${fmt(endDate)}.</p>${chart(r)}<div class="table-wrap" tabindex="0" role="region" aria-label="Penyelesaian per kebiasaan"><table><caption>Penyelesaian per kebiasaan</caption><thead><tr><th scope="col">Kebiasaan</th><th scope="col">Selesai / terjadwal</th><th scope="col">Penyelesaian</th></tr></thead><tbody>${PRESETS.filter(p=>filter==='all'||p.id===filter).map(p=>{const s=report(endDate,period,p.id);return `<tr><th scope="row">${escape(p.name)}</th><td>${s.done}/${s.scheduled}</td><td>${s.percent===null?'—':s.percent+'%'}</td></tr>`}).join('')}</tbody></table></div></section><section class="panel"><h2>Target dan realisasi</h2><p>Akumulasi target harian dibanding angka tercatat sejak aktivasi. Satuan berbeda tidak dijumlahkan atau dirata-ratakan.</p>${measuredTable(endDate,period,filter)}<p class="muted">— berarti belum ada nilai tercatat, bukan otomatis nol. Cakupan adalah jumlah hari dengan angka tercatat dibanding hari terjadwal.</p></section><aside class="panel"><h2>Angka sebagai petunjuk, bukan penilaian diri</h2><p>Versi HTML ini memakai perhitungan sederhana tersendiri: selesai dibagi kesempatan sejak aktivasi. Bukan salinan penuh mesin laporan aplikasi React; riwayat perubahan jadwal, target lama, dan migrasi data tidak disertakan.</p><a href="#riwayat" class="btn" style="margin-top:16px">Tinjau riwayat</a></aside>`+localNote()}
function history(){const rows=Object.entries(state.entries).sort((a,b)=>b[0].localeCompare(a[0])).flatMap(([date,entries])=>Object.entries(entries).map(([id,e])=>{const p=PRESETS.find(p=>p.id===id);return `<tr><th scope="row">${fmt(date)}</th><td>${escape(p?.name||id)}</td><td>${statusLabel(e)}</td><td>${e.value!=null?num(e.value)+' '+escape(p?.unit||''):escape(e.time||'—')}</td><td><button class="btn" data-edit-date="${date}">Buka hari ini</button></td></tr>`}));return heading('Riwayat kebiasaan','Tinjau catatan yang sudah ada, tanpa menghakimi perjalananmu.')+tabs('riwayat')+`<section class="panel">${rows.length?`<div class="table-wrap" tabindex="0" role="region" aria-label="Riwayat catatan"><table><caption>Catatan versi HTML ini</caption><thead><tr><th scope="col">Tanggal</th><th scope="col">Kebiasaan</th><th scope="col">Status</th><th scope="col">Aktual</th><th scope="col">Tindakan</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`:'<div class="empty"><div class="empty-icon">'+icon('book')+'</div><h2>Belum ada catatan</h2><p>Mulai dari satu langkah kecil di halaman Harian. Tidak ada contoh data yang dianggap sebagai pencapaianmu.</p><a class="btn primary" href="#harian">Buka Harian</a></div>'}</section>`+localNote()}
function backup(){return heading('Cadangan data','Simpan salinan catatan versi HTML secara berkala.')+tabs('cadangan')+`<section class="panel"><h2>Ekspor catatan</h2><p>Unduh catatan versi HTML ini sebagai JSON. Data ini tidak sama dengan format backup aplikasi React, dan tidak mengubah data aplikasi sebelumnya.</p><button class="btn primary" id="export-json" style="margin-top:20px">↓ Ekspor JSON</button><p class="muted">Penyimpanan saat membuka file lokal dapat berbeda antarbrowser atau lokasi file. Jangan mengandalkan file HTML sebagai satu-satunya cadangan catatanmu.</p></section><section class="panel"><h2>File ini milikmu</h2><p>Untuk mengubah tampilannya, buka file HTML di editor teks. Bagian CSS, konfigurasi kebiasaan, dan fungsi halaman diberi penanda. Tidak perlu npm, Bun, React, atau GitHub Actions.</p><p class="muted">Impor dan migrasi data aplikasi lama belum disertakan agar data aslinya tidak tersentuh.</p></section>`+localNote()}
function modulePage(id){const m=MODULES.find(m=>m[0]===id);if(!m)return heading('Halaman tidak ditemukan','Pilih halaman melalui menu navigasi.')+'<a class="btn" href="#dashboard">Kembali ke Dashboard</a>';return heading(m[1],m[2])+`<section class="panel empty"><div class="empty-icon">${icon(m[3])}</div><span class="tag">${icon('lock')} Belum tersedia</span><h2 style="margin-top:20px">Ruang ini sedang disiapkan</h2><p>Modul ini juga masih terkunci di source aplikasi. Versi HTML tidak berpura-pura menyediakan fitur yang belum ada.</p><a class="btn" href="#dashboard">Kembali ke Dashboard</a></section>`}
function render(){const page=location.hash.slice(1)||'dashboard';const habitPages=['harian','statistik','riwayat','cadangan'];const active=habitPages.includes(page)?'habit':page;$('#sidebar-nav').innerHTML=MODULES.map(([id,name,desc,ico,tone,available])=>`<a href="#${id==='habit'?'harian':id}" class="nav-link ${active===id?'active':''}" ${active===id?'aria-current="page"':''}>${icon(ico)}<span>${escape(name)}</span>${available?'':icon('lock','nav-lock')}</a>`).join('');document.querySelectorAll('[data-mobile]').forEach(a=>{a.classList.toggle('active',a.dataset.mobile===page);if(a.dataset.mobile===page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});const title=page==='dashboard'?'Life Dashboard':habitPages.includes(page)?({harian:'Habit & Routine Tracker',statistik:'Statistik kebiasaan',riwayat:'Riwayat kebiasaan',cadangan:'Cadangan data'})[page]:page==='lainnya'?'Ruang pertumbuhan':MODULES.find(m=>m[0]===page)?.[1]||'TUMBUH';$('#crumb').textContent=title;document.title=title+' — TUMBUH';const main=$('#main-content');main.innerHTML=page==='dashboard'?dashboard():page==='harian'?daily():page==='statistik'?statistics():page==='riwayat'?history():page==='cadangan'?backup():page==='lainnya'?heading('Ruang untuk bertumbuh','Berbagai sisi kehidupan, dalam satu perjalanan.')+moduleCards()+'<button class="btn" id="mobile-about" style="margin-top:24px">Kenali versi HTML ini</button>'+localNote():modulePage(page);bind();main.classList.remove('enter');void main.offsetWidth;main.classList.add('enter');countUp()}
function bind(){const on=(sel,type,fn)=>{const e=$(sel);if(e)e.addEventListener(type,fn)};on('#focus-btn','click',()=>info('Ruang untuk fokusmu sedang disiapkan','Fitur menyimpan fokus hari ini belum tersedia, mengikuti source dashboard. Untuk sekarang, luangkan waktu sejenak: satu hal apa yang ingin kamu beri perhatian hari ini?'));on('#mobile-about','click',()=>$('#about-btn').click());on('#activate','click',()=>{if(save({...state,started:today()})){notify('11 kebiasaan diaktifkan mulai hari ini. Belum ada realisasi yang dibuat.');render()}});on('#daily-date','change',e=>{if(validDate(e.target.value)&&e.target.value<=today()){selectedDate=e.target.value;render()}});on('#reload-btn','click',()=>location.reload());on('#stats-habit','change',e=>{filter=e.target.value;render()});on('#stats-end','change',e=>{if(validDate(e.target.value)&&e.target.value<=today()){endDate=e.target.value;render()}});on('#clear-filter','click',()=>{filter='all';period=7;endDate=today();render()});on('#refresh-stats','click',()=>{render();notify('Statistik dihitung ulang dari catatan versi HTML ini.')});document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=Number(b.dataset.period);render()});document.querySelectorAll('[data-dash-period]').forEach(b=>b.onclick=()=>{dashPeriod=Number(b.dataset.dashPeriod);render()});document.querySelectorAll('[data-edit-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.editDate;location.hash='harian'});document.querySelectorAll('[data-habit]').forEach(form=>form.addEventListener('submit',e=>{e.preventDefault();const p=PRESETS.find(p=>p.id===form.dataset.habit);const d=form.dataset.date;if(!state.started||d<state.started||d>today()||!storageOK){notify('Tanggal atau penyimpanan tidak tersedia.');return}const f=new FormData(form);const entry={done:false,status:'notDone',value:null,updatedAt:new Date().toISOString()};if(p.kind==='quantity'){const text=String(f.get('value')??'').trim(),v=Number(text);if(!text||!Number.isFinite(v)||v<0){notify('Masukkan angka nol atau lebih.');return}entry.value=v;entry.done=v>=p.target;entry.status=entry.done?'done':v>0?'partial':'notDone'}else if(p.kind==='time'){const t=String(f.get('time')||'');if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(t)){notify('Masukkan waktu yang valid.');return}entry.time=t;entry.done=t===p.time;entry.status=entry.done?'done':'notDone'}else if(p.kind==='checklist'){entry.done=f.has('done');entry.status=entry.done?'done':'notDone'}else{entry.components={};entry.onTime={};for(const [id,name,target] of p.components){const text=String(f.get('component-'+id)??'').trim();if(text==='')continue;const v=Number(text);if(!Number.isFinite(v)||v<0){notify('Nilai komponen harus angka nol atau lebih.');return}entry.components[id]=v;if(p.id==='prayer')entry.onTime[id]=v===1&&f.has('ontime-'+id)}if(!Object.keys(entry.components).length){notify('Catat minimal satu komponen; kolom kosong tetap belum dicatat.');return}entry.done=p.components.every(([id,name,target])=>(entry.components[id]??0)>=target&&(p.id!=='prayer'||entry.onTime[id]));entry.status=entry.done?'done':Object.values(entry.components).some(v=>v>0)?'partial':'notDone'}const next={...state,entries:{...state.entries,[d]:{...state.entries[d],[p.id]:entry}}};if(save(next)){render();notify(entry.done?'Selesai — satu langkah kecil yang berarti.':'Catatan tersimpan di browser ini.');if(entry.done)burst(lastClick.x,lastClick.y)}}));document.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{if(!confirm('Batalkan catatan kebiasaan ini untuk tanggal '+selectedDate+'?'))return;const entries={...state.entries},records={...entries[selectedDate]};delete records[b.dataset.undo];if(Object.keys(records).length)entries[selectedDate]=records;else delete entries[selectedDate];if(save({...state,entries})){render();notify('Catatan dibatalkan.')}});on('#export-json','click',()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tumbuh-catatan-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Cadangan versi HTML telah disiapkan.')})}
function countUp(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;document.querySelectorAll('[data-count]').forEach(el=>{const end=Number(el.dataset.count),suf=el.dataset.suffix||'';if(!end)return;const t0=performance.now();const tick=t=>{const k=Math.min(1,(t-t0)/900);el.textContent=Math.round(end*(1-Math.pow(1-k,3)))+suf;if(k<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)})}
document.addEventListener('pointermove',e=>{const c=e.target.closest?.('.panel,.module-card,.stat');if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')});
function burst(x,y){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const colors=['#c79a3b','#2f7458','#9fd0ac','#e3bd62','#1f4d3c'];for(let i=0;i<18;i++){const b=document.createElement('i');b.className='burst';b.style.left=x+'px';b.style.top=y+'px';b.style.background=colors[i%colors.length];const a=Math.PI*2*i/18,d=50+Math.random()*60;b.style.setProperty('--dx',Math.cos(a)*d+'px');b.style.setProperty('--dy',Math.sin(a)*d-20+'px');b.style.setProperty('--rot',Math.random()*540+'deg');document.body.appendChild(b);setTimeout(()=>b.remove(),950)}}
let lastClick={x:innerWidth/2,y:innerHeight/2};document.addEventListener('click',e=>{lastClick={x:e.clientX,y:e.clientY}},true);
function syncThemeIcon(){$('#theme-btn').textContent=document.documentElement.dataset.theme==='dark'?'☀':'☾'}
$('#theme-btn').addEventListener('click',syncThemeIcon);syncThemeIcon();
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);$('#main-content').focus({preventScroll:true})});
render();
</script>
</body>
