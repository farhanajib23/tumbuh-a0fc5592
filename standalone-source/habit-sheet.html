<style>
.hs-hero{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px;border:1px solid var(--border);border-radius:22px;background:linear-gradient(120deg,var(--secondary),var(--card));margin:20px 0}.hs-hero p{font-size:12px;margin-top:9px}.hs-hero .eyebrow{color:var(--primary);margin-bottom:7px}.hs-hero .tag{white-space:nowrap}.hs-tools{display:flex;gap:12px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin:18px 0}.hs-search{flex:1;max-width:340px;min-width:180px}.hs-date-tools{display:flex;gap:7px;align-items:end}.hs-date-tools label{max-width:170px}.hs-date-tools .btn{padding:10px}.hs-filters{display:flex;gap:6px;flex-wrap:wrap}.hs-filters .btn{min-height:38px;font-size:11px;padding:7px 12px;border-radius:30px}.hs-help{font-size:11px;margin:12px 0;color:var(--sub)}.hs-sheet{border:1px solid var(--border);border-radius:20px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}.hs-head,.hs-line{display:grid;grid-template-columns:minmax(200px,1fr) 126px repeat(7,40px) 70px;gap:6px;align-items:center;padding:16px 18px}.hs-head{background:var(--muted);border-bottom:1px solid var(--border);font-size:10px;font-weight:700;color:var(--sub)}.hs-head>span:nth-child(n+3){text-align:center}.hs-head b{display:block;font-size:13px}.hs-rows{list-style:none;margin:0;padding:0}.hs-item{border-bottom:1px solid var(--border)}.hs-item:last-child{border:0}.hs-line{transition:background .2s}.hs-line:hover{background:var(--muted)}.hs-item.is-open .hs-line{background:var(--secondary)}.hs-name{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;color:var(--fg);padding:0;width:100%;min-height:44px}.hs-name .habit-icon{flex-shrink:0;width:36px;height:36px;border-radius:12px}.hs-label{display:block;font-size:12.5px;font-weight:650}.hs-sub{display:block;font-size:10px;color:var(--sub);margin-top:3px}.hs-target{font-size:10px;color:var(--sub)}.hs-target b{display:block;font-size:11px;color:var(--fg)}.hs-cell{justify-self:center;width:36px;height:38px;padding:3px;border:1px solid var(--border);border-radius:10px;background:var(--card-solid);color:var(--sub);transition:transform .2s,border-color .2s}.hs-cell:hover:not(:disabled){transform:translateY(-2px);border-color:var(--primary)}.hs-cell.is-current{box-shadow:inset 0 -3px var(--accent)}.hs-cell.s-done{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}.hs-cell.s-partial{background:var(--secondary);color:var(--primary)}.hs-check{display:inline-grid;place-items:center;width:20px;height:20px;border:1px solid currentColor;border-radius:6px;font-size:13px}.hs-cell small{display:none}.hs-edit{padding:7px 10px;font-size:11px;min-height:38px}.hs-detail{padding:0 18px 18px;background:var(--secondary);animation:rise .25s var(--ease)}.hs-detail-top{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;font-size:11px;color:var(--sub)}.hs-detail-top button{background:none;border:0;color:var(--primary);min-height:44px}.hs-editor{border:1px solid var(--border);border-radius:16px;padding:20px;background:var(--card-solid)}.hs-editor h3{font:600 19px var(--display)}.hs-editor>p{font-size:12px;margin:10px 0}.hs-editor .habit-card{padding:0;margin:0;border:0;box-shadow:none;backdrop-filter:none;background:none;transform:none!important}.hs-editor .habit-card:before,.hs-editor .habit-title{display:none}.hs-stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:18px 0}.hs-stage{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;border:1px solid var(--border);border-radius:15px;padding:14px 8px;background:var(--muted);cursor:pointer;transition:background .2s,border-color .2s}.hs-stage:has(input:checked){background:var(--secondary);border-color:var(--primary)}.hs-stage input{width:24px;height:24px}.hs-stage b{font-size:11px}.hs-stage small{font-size:10px;color:var(--sub)}.hs-extras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 18px}.hs-extra{display:flex;align-items:center;gap:9px;padding:12px;border:1px solid var(--border);border-radius:12px;font-size:12px}.hs-extra small{display:block;font-size:10px;color:var(--sub)}.hs-progress{height:7px;border-radius:9px;overflow:hidden;background:var(--muted);margin:12px 0}.hs-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--primary-2));transition:width .35s var(--ease)}.hs-completion{font-size:12px;padding:11px 14px;border-radius:12px;background:var(--muted);color:var(--sub);display:flex;align-items:center;gap:10px}.hs-completion.done{background:var(--secondary);color:var(--primary)}.hs-completion input{pointer-events:none}.hs-water-value{font:600 34px var(--display);margin:16px 0 6px}.hs-water-value small{font:400 13px system-ui;color:var(--sub)}.hs-water-track{position:relative;height:24px;border:1px solid var(--border);border-radius:30px;overflow:hidden;background:var(--muted);margin:14px 0 20px}.hs-water-track i{display:block;height:100%;background:linear-gradient(90deg,#9ec8c4,#2d8079);border-radius:30px;transition:width .4s var(--ease)}.hs-number-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.hs-notice{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:11px;padding:10px 14px;background:var(--secondary);border-radius:13px;margin:12px 0}.hs-notice .btn{min-height:38px;font-size:11px}.hs-legend{display:flex;gap:16px;flex-wrap:wrap;padding:14px 18px;background:var(--muted);font-size:10px;color:var(--sub);border-top:1px solid var(--border)}.hs-no-results{text-align:center;padding:30px;font-size:12px}.hs-footer{font-size:10px;margin-top:15px;color:var(--sub)}
@media(min-width:901px) and (max-width:1250px){.hs-head,.hs-line{grid-template-columns:minmax(140px,1fr) 105px repeat(7,32px) 62px;gap:4px;padding-inline:12px}.hs-cell{width:30px}.hs-name .habit-icon{display:none}}
@media(max-width:900px){.hs-head{display:none}.hs-line{grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;padding:17px 14px}.hs-name{grid-column:1/6;grid-row:1}.hs-target{grid-column:1/6;grid-row:2;margin-top:-7px;padding-left:46px}.hs-target b{display:inline}.hs-edit{grid-column:6/8;grid-row:1/3;justify-self:end}.hs-cell{width:100%;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.hs-cell small{display:block;font-size:8px;line-height:1}.hs-cell .hs-check{width:19px;height:19px}.hs-tools{gap:12px}.hs-search{min-width:100%;max-width:none}.hs-date-tools{width:100%;justify-content:flex-end}.hs-detail{padding:0 12px 14px}.hs-stages{grid-template-columns:repeat(3,minmax(0,1fr))}.hs-extras{grid-template-columns:1fr}.hs-hero{padding:20px;align-items:flex-start}.hs-hero h2{font-size:21px}.hs-editor{padding:16px}.hs-legend{gap:10px}.hs-notice{align-items:flex-start}}
@media(max-width:400px){.hs-stages{grid-template-columns:repeat(2,minmax(0,1fr))}.hs-number-grid{grid-template-columns:1fr}}
</style>
<script>
'use strict';
const hs={open:null,query:'',filter:'all',dirty:false,undo:null};
const hsOldBind=bind,hsOldSave=save;
save=function(next){const ok=hsOldSave(next);if(ok)hs.dirty=false;return ok};
const hsPreset=id=>PRESETS.find(p=>p.id===id);
const hsAllowed=d=>storageOK&&!!state.started&&validDate(d)&&d>=state.started&&d<=today();
function hsStatus(p,e){if(!e)return 'unrecorded';if(p.id==='water')return e.value>=p.target?'done':e.value>0?'partial':'notDone';if(p.id==='workout'){const v=e.components||{};return p.components.every(([id,n,t])=>(v[id]??0)>=t)?'done':Object.values(v).some(x=>x>0)?'partial':'notDone'}return e.status}
const hsLabel=s=>({done:'Selesai',partial:'Parsial',notDone:'Belum selesai',unrecorded:'Belum dicatat'})[s];
function hsProgress(p,e){if(p.id==='workout'){const v=e?.components||{};return `${p.components.slice(0,5).filter(([id,n,t])=>(v[id]??0)>=t).length}/5 sesi · ${p.components.slice(5).filter(([id,n,t])=>(v[id]??0)>=t).length}/3 tambahan`}if(p.kind==='quantity')return `${e?.value==null?'—':num(e.value)} / ${num(p.target)} ${escape(p.unit)}`;if(p.kind==='time')return `${escape(e?.time||'—')} / ${p.time}`;return hsLabel(hsStatus(p,e))}
const hsTarget=p=>p.id==='workout'?'5 sesi + 3 latihan':p.kind==='quantity'?`${num(p.target)} ${escape(p.unit)}`:p.kind==='time'?p.time:p.kind==='components'?'5 waktu tepat waktu':'1 sesi / tindakan';
function hsLeave(){if(!hs.dirty)return true;if(!confirm('Ada isian yang belum disimpan. Tinggalkan isian ini?'))return false;hs.dirty=false;return true}
function hsBuildEntry(p,changes,previous){const e={...(previous||{}),...changes,updatedAt:new Date().toISOString()};e.status=hsStatus(p,e);e.done=e.status==='done';return e}
function hsWrite(id,changes){const p=hsPreset(id),d=selectedDate;if(!p||!['water','workout'].includes(id)||!hsAllowed(d)){notify('Pencatatan tidak tersedia.');return false}const before=state.entries[d]?.[id];const e=hsBuildEntry(p,changes,before);const next={...state,entries:{...state.entries,[d]:{...state.entries[d],[id]:e}}};const focused=document.activeElement?.id;if(!save(next))return false;hs.undo={id,date:d,before:before?JSON.parse(JSON.stringify(before)):null,after:JSON.stringify(e)};render();if(focused)document.getElementById(focused)?.focus({preventScroll:true});notify(e.done?'Target lengkap. Kebiasaan ditandai selesai.':'Progres tersimpan; target belum lengkap.');if(e.done&&(!before||!before.done))burst(lastClick.x,lastClick.y);return true}
function hsUndo(){const u=hs.undo;if(!u||!hsLeave())return;const current=state.entries[u.date]?.[u.id];if(JSON.stringify(current)!==u.after){notify('Catatan sudah berubah; pembatalan lama tidak diterapkan.');return}const records={...state.entries[u.date]},entries={...state.entries};if(u.before)records[u.id]=u.before;else delete records[u.id];if(Object.keys(records).length)entries[u.date]=records;else delete entries[u.date];if(save({...state,entries})){hs.undo=null;render();notify('Pembaruan terakhir diurungkan.')}}
function hsWork(p,e){const v=e?.components||{},status=hsStatus(p,e),enabled=hsAllowed(selectedDate),a=p.components.slice(0,5),extra=p.components.slice(5);const box=([id,name,target,unit],i)=>`<label class="${i<5?'hs-stage':'hs-extra'}"><input id="hs-c-${id}" type="checkbox" data-hs-component="${id}" ${v[id]>=target?'checked':''} ${enabled?'':'disabled'}><span><b>${escape(i<5?name.replace('Push-up setelah ',''):name)}</b><small>${target} ${unit}${v[id]!=null?' · aktual '+num(v[id]):''}</small></span></label>`;return `<div class="hs-editor"><h3>Workout harian</h3><p>${hsProgress(p,e)}. Centang setiap sesi hanya setelah targetnya benar-benar dilakukan.</p><div class="hs-stages">${a.map((c,i)=>box(c,i)).join('')}</div><h4>Latihan tambahan</h4><div class="hs-extras">${extra.map((c,i)=>box(c,i+5)).join('')}</div><div class="hs-completion ${status==='done'?'done':''}"><input type="checkbox" disabled ${status==='done'?'checked':''} aria-label="Workout lengkap"><span>${status==='done'?'Semua 8 komponen selesai.':'Centang utama menunggu 5 sesi push-up dan 3 latihan tambahan selesai.'}</span></div><details><summary>Catat sebagian atau koreksi jumlah</summary><form id="hs-partial"><div class="hs-number-grid">${p.components.map(([id,name,target,unit])=>`<label>${escape(name)} (${unit})<input type="number" min="0" step="any" name="${id}" value="${v[id]??''}" placeholder="Belum dicatat" ${enabled?'':'disabled'}></label>`).join('')}</div><button class="btn primary" ${enabled?'':'disabled'}>Simpan jumlah aktual</button></form></details><p class="small">Mencentang menyimpan minimal target komponen; melepas centang mencatat 0. Gunakan koreksi jumlah untuk progres parsial. Kamu bisa mengurungkan pembaruan terakhir. Jangan berlatih melalui rasa sakit.</p></div>`}
function hsWater(p,e){const v=e?.value??0,status=hsStatus(p,e),enabled=hsAllowed(selectedDate);return `<div class="hs-editor"><h3>Minum air putih</h3><div class="hs-water-value">${num(v)} <small>/ ${num(p.target)} ml</small></div><div class="hs-water-track" role="progressbar" aria-label="Capaian volume air tercatat" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(100,Math.round(v/p.target*100))}" aria-valuetext="${num(v)} dari ${num(p.target)} ml"><i style="width:${Math.min(100,v/p.target*100)}%"></i></div><div class="actions">${[250,500].map(n=>`<button id="hs-add-${n}" class="btn primary" data-hs-water="${n}" ${enabled?'':'disabled'}>+${n} ml</button>`).join('')}</div><p>Tekan hanya untuk air yang sudah kamu minum, bukan rencana minum.</p><div class="hs-completion ${status==='done'?'done':''}"><input type="checkbox" disabled ${status==='done'?'checked':''} aria-label="Target air putih tercapai"><span>${status==='done'?'Target harian tercapai.':'Belum mencapai 4.000 ml; centang utama belum aktif.'}</span></div><details><summary>Ubah total aktual</summary><form id="hs-water-total"><label for="hs-total">Total yang sudah diminum (ml)<input id="hs-total" name="total" type="number" min="0" step="any" required value="${e?.value??''}" ${enabled?'':'disabled'}></label><button class="btn" style="margin-top:12px" ${enabled?'':'disabled'}>Simpan total</button></form></details><p class="small">4.000 ml adalah target pribadi pada konfigurasi ini, bukan rekomendasi universal. Jangan memaksakan target atau minum banyak sekaligus.</p></div>`}
function hsRow(p,days){const e=state.entries[selectedDate]?.[p.id],status=hsStatus(p,e),open=hs.open===p.id;return `<li class="hs-item ${open?'is-open':''}" data-hs-row="${p.id}" data-name="${escape(p.name.toLocaleLowerCase('id-ID'))}" data-status="${status}"><div class="hs-line"><button class="hs-name" data-hs-open="${p.id}" aria-expanded="${open}" aria-controls="hs-detail-${p.id}"><span class="habit-icon">${icon(p.icon)}</span><span><span class="hs-label">${escape(p.name)}</span><span class="hs-sub">${hsProgress(p,e)}</span></span></button><div class="hs-target"><b>${hsTarget(p)}</b><span>${hsLabel(status)}</span></div>${days.map(d=>{const entry=state.entries[d]?.[p.id],s=hsStatus(p,entry);return `<button class="hs-cell s-${s} ${d===selectedDate?'is-current':''}" data-hs-cell="${p.id}" data-date="${d}" ${hsAllowed(d)?'':'disabled'} aria-label="${escape(p.name)}, ${fmt(d)}, ${hsLabel(s)}. Buka pencatatan."><small>${new Intl.DateTimeFormat('id-ID',{weekday:'short'}).format(parseDate(d))} ${parseDate(d).getDate()}</small><span class="hs-check" aria-hidden="true">${s==='done'?'✓':s==='partial'?'−':''}</span></button>`}).join('')}<button class="btn hs-edit" data-hs-open="${p.id}" aria-expanded="${open}" aria-controls="hs-detail-${p.id}">${open?'Tutup':e?'Edit':'Catat'}</button></div><div id="hs-detail-${p.id}" class="hs-detail" ${open?'':'hidden'}><div class="hs-detail-top"><span>${escape(p.name)} · ${fmt(selectedDate)}</span><button data-hs-close="${p.id}">Tutup ×</button></div>${p.id==='workout'?hsWork(p,e):p.id==='water'?hsWater(p,e):'<div class="hs-editor">'+habitCard(p)+'</div>'}</div></li>`}
daily=function(){const s=summary(selectedDate),days=Array.from({length:7},(_,i)=>shift(selectedDate,i-6));return heading('Habit & Routine Tracker','Satu baris untuk setiap kebiasaan. Progres kecil tetap berarti.')+tabs('harian')+`<section class="hs-hero"><div><div class="eyebrow">Ruang kebiasaanmu</div><h2>11 kebiasaan. Satu langkah hari ini.</h2><p>${s.done} dari ${s.scheduled} kebiasaan terjadwal selesai · ${fmt(selectedDate)}.</p>${!state.started?`<button class="btn primary" id="activate" style="margin-top:14px" ${storageOK?'':'disabled'}>Aktifkan 11 kebiasaan</button>`:''}</div><span class="tag done">${s.percent===null?'Belum aktif':s.percent+'% selesai'}</span></section>${!storageOK?`<p class="error" role="alert">${escape(storageProblem)}</p>`:''}<div class="hs-tools"><label class="hs-search">Cari kebiasaan<input id="hs-search" type="search" value="${escape(hs.query)}" placeholder="Membaca, workout, air putih…"></label><div class="hs-date-tools"><button class="btn" id="hs-prev" aria-label="Tanggal sebelumnya">‹</button><label>Tanggal pencatatan<input id="hs-date" type="date" value="${selectedDate}" max="${today()}" required></label><button class="btn" id="hs-next" aria-label="Tanggal berikutnya" ${selectedDate>=today()?'disabled':''}>›</button><button class="btn" id="hs-today">Hari ini</button></div></div><div class="hs-tools"><div class="hs-filters" role="group" aria-label="Filter status">${[['all','Semua'],['unrecorded','Belum dicatat'],['partial','Parsial'],['done','Selesai'],['notDone','Belum selesai']].map(([key,label])=>`<button class="btn" data-hs-filter="${key}" aria-pressed="${hs.filter===key}">${label}</button>`).join('')}</div><span class="muted" id="hs-result" role="status" aria-live="polite"></span></div><p class="hs-help">Klik nama kebiasaan atau kotak tanggal untuk mencatat. Centang utama mengikuti syarat selesai, bukan sekadar klik. Garis emas menandai tanggal dipilih.</p>${hs.undo?`<div class="hs-notice" role="status"><span>Pembaruan ${escape(hsPreset(hs.undo.id).name)} · ${fmt(hs.undo.date)} tersimpan.</span><button class="btn" id="hs-undo">Urungkan</button></div>`:''}<section class="hs-sheet" aria-label="Daftar kebiasaan tujuh hari"><div class="hs-head" aria-hidden="true"><span>Kebiasaan / progres</span><span>Target harian</span>${days.map(d=>`<span>${new Intl.DateTimeFormat('id-ID',{weekday:'short'}).format(parseDate(d))}<b>${parseDate(d).getDate()}</b></span>`).join('')}<span>Catatan</span></div><ul class="hs-rows">${PRESETS.map(p=>hsRow(p,days)).join('')}</ul><p class="hs-no-results" id="hs-empty" hidden>Tidak ada hasil. Ubah pencarian atau pilih Semua.</p><div class="hs-legend"><span>✓ Selesai</span><span>− Progres parsial</span><span>□ Belum selesai / belum dicatat</span><span>Kotak redup: pencatatan tidak tersedia</span></div></section><p class="hs-footer">${fmt(days[0])}–${fmt(selectedDate)} · Progres berdasarkan catatanmu, bukan data contoh. Membuka rincian tidak membuat catatan baru.</p>`+localNote()};
function hsFilter(){let n=0;document.querySelectorAll('[data-hs-row]').forEach(row=>{const yes=row.dataset.name.includes(hs.query.trim().toLocaleLowerCase('id-ID'))&&(hs.filter==='all'||row.dataset.status===hs.filter);row.hidden=!yes;if(yes)n++});const result=document.getElementById('hs-result');if(result)result.textContent=`${n} dari 11 kebiasaan`;const empty=document.getElementById('hs-empty');if(empty)empty.hidden=n>0}
function hsDate(d,id=null){if(!validDate(d)||d>today()||!hsLeave())return false;selectedDate=d;hs.open=id;render();if(id)hsFocus(id);return true}
function hsFocus(id){const node=document.getElementById('hs-detail-'+id);node?.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});node?.querySelector('input:not(:disabled),select:not(:disabled),button:not(:disabled)')?.focus({preventScroll:true})}
bind=function(){hsOldBind();if(!document.getElementById('hs-search'))return;document.getElementById('hs-search').oninput=e=>{hs.query=e.target.value;hsFilter()};document.querySelectorAll('[data-hs-filter]').forEach(b=>b.onclick=()=>{hs.filter=b.dataset.hsFilter;document.querySelectorAll('[data-hs-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));hsFilter()});document.getElementById('hs-date').onchange=e=>{if(!hsDate(e.target.value))e.target.value=selectedDate};document.getElementById('hs-prev').onclick=()=>hsDate(shift(selectedDate,-1));document.getElementById('hs-next').onclick=()=>hsDate(shift(selectedDate,1));document.getElementById('hs-today').onclick=()=>hsDate(today());document.querySelectorAll('[data-hs-open]').forEach(b=>b.onclick=()=>{if(!hsLeave())return;hs.open=hs.open===b.dataset.hsOpen?null:b.dataset.hsOpen;render();if(hs.open)hsFocus(hs.open)});document.querySelectorAll('[data-hs-close]').forEach(b=>b.onclick=()=>{if(!hsLeave())return;const id=b.dataset.hsClose;hs.open=null;render();document.querySelector(`[data-hs-open="${id}"]`)?.focus()});document.querySelectorAll('[data-hs-cell]').forEach(b=>b.onclick=()=>hsDate(b.dataset.date,b.dataset.hsCell));document.querySelectorAll('[data-hs-component]').forEach(b=>b.onchange=()=>{if(!hsLeave()){b.checked=!b.checked;return}const p=hsPreset('workout'),c=p.components.find(c=>c[0]===b.dataset.hsComponent),v={...state.entries[selectedDate]?.workout?.components};v[c[0]]=b.checked?Math.max(v[c[0]]||0,c[2]):0;if(!hsWrite('workout',{value:null,components:v}))b.checked=!b.checked});document.querySelectorAll('[data-hs-water]').forEach(b=>b.onclick=()=>{if(hsLeave())hsWrite('water',{value:(state.entries[selectedDate]?.water?.value??0)+Number(b.dataset.hsWater)})});const partial=document.getElementById('hs-partial');if(partial)partial.onsubmit=e=>{e.preventDefault();const values={},f=new FormData(partial);for(const [id] of hsPreset('workout').components){const t=String(f.get(id)??'').trim();if(!t)continue;const n=Number(t);if(!Number.isFinite(n)||n<0){notify('Masukkan angka nol atau lebih.');return}values[id]=n}if(!Object.keys(values).length){notify('Catat minimal satu komponen.');return}hsWrite('workout',{value:null,components:values})};const water=document.getElementById('hs-water-total');if(water)water.onsubmit=e=>{e.preventDefault();const t=String(new FormData(water).get('total')??'').trim(),v=Number(t);if(!t||!Number.isFinite(v)||v<0){notify('Masukkan angka nol atau lebih.');return}hsWrite('water',{value:v})};const undo=document.getElementById('hs-undo');if(undo)undo.onclick=hsUndo;document.querySelectorAll('[data-habit],#hs-partial,#hs-water-total').forEach(f=>f.addEventListener('input',()=>hs.dirty=true));hsFilter()};
document.addEventListener('click',e=>{const a=e.target.closest?.('a[href^="#"]');if(a&&a.hash!==location.hash&&hs.dirty&&!hsLeave())e.preventDefault()},true);
window.addEventListener('beforeunload',e=>{if(hs.dirty){e.preventDefault();e.returnValue=''}});
render();
</script>
