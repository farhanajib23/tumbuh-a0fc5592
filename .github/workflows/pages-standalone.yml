name: TUMBUH - Preview HTML mandiri
on:
  push:
    branches: [preview/standalone-html]
    paths: ['standalone-source/**', '.github/workflows/pages-standalone.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tumbuh-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'farhanajib23/tumbuh-a0fc5592' && github.ref == 'refs/heads/preview/standalone-html'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Gabungkan dan periksa HTML tanpa build React
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          src = Path('standalone-source')
          content = (src / 'page-prefix.html').read_bytes() + (src / 'page-suffix.html').read_bytes()
          if content.count(b'</body>') != 1:
              raise SystemExit('Penutup body HTML tidak valid.')
          content = content.replace(b'</body>', (src / 'habit-sheet.html').read_bytes() + b'</body>')
          digest = hashlib.sha256(content).hexdigest()
          if digest != (src / 'expected.sha256').read_text().strip():
              raise SystemExit('Checksum HTML berbeda; publikasi diblokir.')
          site = Path('.standalone-site')
          site.mkdir()
          (site / 'index.html').write_bytes(content)
          (site / '.nojekyll').touch()
          (site / 'preview-version.json').write_text(json.dumps({'commit': os.environ['GITHUB_SHA'], 'branch': os.environ['GITHUB_REF_NAME'], 'sha256': digest}), encoding='utf-8')
          print('Checksum HTML cocok:', digest)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .standalone-site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verifikasi HTML yang tersaji
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: python
        run: |
          import hashlib, json, os, time
          from pathlib import Path
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen
          root = os.environ.get('PAGE_URL', '').rstrip('/') + '/'
          if urlparse(root).scheme != 'https':
              raise SystemExit('URL HTTPS tidak tersedia.')
          expected = Path('standalone-source/expected.sha256').read_text().strip()
          matched = False
          for attempt in range(12):
              try:
                  query = '?verify=' + os.environ['GITHUB_SHA'] + '&attempt=' + str(attempt)
                  with urlopen(Request(root + 'preview-version.json' + query, headers={'Cache-Control': 'no-cache'}), timeout=10) as response:
                      version = json.load(response)
                  with urlopen(Request(root + 'index.html' + query, headers={'Cache-Control': 'no-cache'}), timeout=10) as response:
                      digest = hashlib.sha256(response.read()).hexdigest()
                  matched = version.get('commit') == os.environ['GITHUB_SHA'] and version.get('branch') == os.environ['GITHUB_REF_NAME'] and version.get('sha256') == expected and digest == expected
                  if matched:
                      break
              except Exception as error:
                  print(type(error).__name__)
              if attempt < 11:
                  time.sleep(5)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('URL: ' + root + '\nHTML live cocok: ' + str(matched) + '\nBukan pengujian visual browser.\n')
          if not matched:
              raise SystemExit('Versi live belum cocok; tidak ada rollback otomatis.')
