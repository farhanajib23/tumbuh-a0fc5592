name: TUMBUH - Perbaikan lint Statistik

on:
  push:
    branches: [feature/eleven-daily-habits]
    paths: [.github/workflows/format-eleven-habits.yml]

permissions:
  contents: read

concurrency:
  group: format-eleven-habits
  cancel-in-progress: false

jobs:
  format-and-verify:
    if: github.repository == 'farhanajib23/tumbuh-a0fc5592' && github.ref == 'refs/heads/feature/eleven-daily-habits'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalasi terkunci
        run: bun install --frozen-lockfile
      - name: Format hanya komponen dan test Statistik
        run: >-
          bun run prettier --write
          src/components/tumbuh/statistics-dashboard.tsx
          src/test/statistics-dashboard.test.tsx
      - name: Simpan hasil format ke branch fitur tanpa force-push
        run: |
          git add -- src/components/tumbuh/statistics-dashboard.tsx src/test/statistics-dashboard.test.tsx
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(statistics): apply repository Prettier formatting'
            git push origin HEAD:refs/heads/feature/eleven-daily-habits
          fi
          {
            echo '## Perbaikan format Statistik'
            echo "Commit pemicu: $GITHUB_SHA"
            echo "Commit source yang diperiksa: $(git rev-parse HEAD)"
            echo 'Perubahan formatter dibatasi ke dua file Statistik; aturan lint dan assertion tidak dimatikan.'
            echo 'Commit bot tidak diandalkan untuk memicu workflow lain; pemeriksaan dijalankan di workflow ini.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Periksa source setelah formatting
        env:
          TUMBUH_PAGES: 'true'
          VITE_BUILD_BRANCH: feature/eleven-daily-habits
        run: |
          export VITE_BUILD_SHA="$(git rev-parse HEAD)"
          failed=0
          for command in 'bun run lint' 'bun run tsc --noEmit' 'bun run test' 'bun run build'; do
            echo "::group::$command"
            if bash -e -o pipefail -c "$command"; then
              echo "$command: success" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$command: failure" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
            echo '::endgroup::'
          done
          echo 'Tidak melakukan deployment, merge, atau pengujian visual browser.' >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
